name: macOS Release

# The Windows release host builds Windows locally and Linux over SSH; this is
# its macOS half. tools/release.py dispatches it once the release is published.
# (cloud-release.yml has its own macOS job.)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build the macOS app for and attach it to
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          lfs: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Require Apple Silicon
        run: |
          [ "$(uname -m)" = arm64 ] || { echo "::error::Expected an Apple Silicon runner, got $(uname -m)"; exit 1; }

      - name: Build
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: bash tools/build_macos.sh

      - name: Attach to release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_REPO: serrebi/Accessible-IPTV-Client
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          api="https://git.serrebiradio.com/api/v1/repos/$FORGEJO_REPO"
          [ -n "${FORGEJO_TOKEN:-}" ] || { echo "::error::FORGEJO_TOKEN secret is not set."; exit 1; }
          release="$(curl -sS -H "Authorization: token $FORGEJO_TOKEN" "$api/releases/tags/$TAG")"
          id="$(echo "$release" | jq -r '.id // empty')"
          [ -n "$id" ] || { echo "::error::No Forgejo release for $TAG."; exit 1; }
          shopt -s nullglob
          files=(dist/AccessibleIPTVClient-v*-macos-*.zip)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No macOS zip to upload."; exit 1; }
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            asset_id="$(echo "$release" | jq -r --arg name "$name" '[.assets[]? | select(.name == $name) | .id][0] // empty')"
            if [ -n "$asset_id" ]; then
              echo "Replacing $name on $TAG..."
              curl -sS -X DELETE -H "Authorization: token $FORGEJO_TOKEN" \
                "$api/releases/$id/assets/$asset_id" >/dev/null
            else
              echo "Uploading $name to $TAG..."
            fi
            curl -sS -H "Authorization: token $FORGEJO_TOKEN" \
              -F "attachment=@$file" "$api/releases/$id/assets?name=$name" >/dev/null
          done

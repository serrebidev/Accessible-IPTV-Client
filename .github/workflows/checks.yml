name: Checks

# The gate a change needs before it merges: the suite and the lint on a clean
# runner, in about four minutes. Releases stay manual (cloud-release.yml).
#
# The checkout is shallow-free so the tests that read the tree see the whole
# repo, and the pip cache keys on requirements.txt, which carries the case.
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      # Three files need a machine with libVLC, SAPI voices and a real desktop:
      # the runner has none of the first two, and the updater helper's
      # PowerShell start is slow enough to pass its 60 s timeout only sometimes.
      # Everything these files cover is checked on a dev box (and the player GUI
      # by tools/smoke_*); the gate keeps the rest honest on every change.
      - name: Tests
        run: >
          python -m pytest -q
          --ignore=tests/test_player_transport_gui.py
          --ignore=tests/test_internal_player.py
          --ignore=tests/test_app_tts.py
          --deselect tests/test_updater.py::test_update_helper_actually_starts_from_a_path_with_a_space

name: Checks

# The gate a change needs before it merges: the suite and the lint on a clean
# runner, in about four minutes. Releases stay manual (cloud-release.yml).
#
# The checkout is shallow-free so the tests that read the tree see the whole
# repo, and the pip cache keys on requirements.txt, which carries the case.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q
